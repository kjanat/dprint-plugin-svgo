name: Check Updates
run-name: "${{ (inputs.version && format('{0}: {1} → {2} (vermon)', inputs.package, inputs.previous || 'new', inputs.version)) || inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Human-readable trigger summary, used as the run name when no structured inputs are given
        required: false
        type: string
      package:
        description: Package whose release triggered this run
        required: false
        type: string
      registry:
        description: Registry the release was observed on
        required: false
        type: string
      version:
        description: Newly observed version
        required: false
        type: string
      previous:
        description: Previously observed version
        required: false
        type: string
  schedule:
    # do this three times a week
    - cron: "0 7 * * 1,3,5"

permissions:
  contents: write

jobs:
  build:
    name: check updates
    if: github.repository == 'kjanat/dprint-plugin-svgo'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DPRINT_PAT }}
          submodules: recursive

      - uses: denoland/setup-deno@v2
      - uses: extractions/setup-just@v4
      - uses: dsherret/rust-toolchain-file@v1

      - name: Run script
        env: { GITHUB_TOKEN: "${{ secrets.DPRINT_PAT }}" }
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}[bot]"
          just --yes update

  # This is necessary to prevent GH automatically disabling this workflow after 60 days.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps: [{ uses: liskin/gh-workflow-keepalive@v1 }]
