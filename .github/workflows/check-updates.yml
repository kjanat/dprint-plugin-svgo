name: Check Updates
run-name: "${{ inputs.beepboop_execution_id && format('Release operation {0}', inputs.beepboop_execution_id) || 'Check Updates' }}"

on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution that dispatched this run
        required: false
        type: string
  schedule:
    # do this three times a week
    - cron: "0 7 * * 1,3,5"

permissions:
  contents: read

jobs:
  build:
    name: check updates
    if: github.repository == 'kjanat/dprint-plugin-svgo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate as Beepboop
        id: beepboop
        uses: kjanat/beepboop/actions/token@ee97aa4aad9688f2ccf07e09338d4193740d19f0
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          permissions: '{"contents":"write"}'

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.beepboop.outputs.token }}
          submodules: recursive

      - uses: denoland/setup-deno@v2
      - uses: extractions/setup-just@v4
      - uses: dsherret/rust-toolchain-file@v1

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ steps.beepboop.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.beepboop.outputs.bot-login }}
          GIT_AUTHOR_EMAIL: ${{ steps.beepboop.outputs.bot-email }}
          GIT_COMMITTER_NAME: ${{ steps.beepboop.outputs.bot-login }}
          GIT_COMMITTER_EMAIL: ${{ steps.beepboop.outputs.bot-email }}
        run: just --yes update

  # This is necessary to prevent GH automatically disabling this workflow after 60 days.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps: [{ uses: liskin/gh-workflow-keepalive@v1 }]
