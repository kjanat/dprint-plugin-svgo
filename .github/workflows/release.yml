name: Release

on:
  workflow_dispatch:
    inputs:
      releaseKind:
        description: Kind of release
        default: patch
        type: choice
        # major support unknown (@dprint/automation/0.10.3), don't care to check.
        options: [patch, minor]
        required: true

jobs:
  rust:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate as Beepboop
        id: beepboop
        uses: kjanat/beepboop/actions/token@ee97aa4aad9688f2ccf07e09338d4193740d19f0
        with:
          permissions: '{"contents":"write"}'

      - name: Clone repository
        uses: actions/checkout@v7
        with: { token: "${{ steps.beepboop.outputs.token }}", submodules: recursive }

      - uses: denoland/setup-deno@v2
      - uses: extractions/setup-just@v4
      - uses: dsherret/rust-toolchain-file@v1

      - name: Bump version and tag
        env:
          GITHUB_TOKEN: ${{ steps.beepboop.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.beepboop.outputs.bot-login }}
          GIT_AUTHOR_EMAIL: ${{ steps.beepboop.outputs.bot-email }}
          GIT_COMMITTER_NAME: ${{ steps.beepboop.outputs.bot-login }}
          GIT_COMMITTER_EMAIL: ${{ steps.beepboop.outputs.bot-email }}
          RELEASE_KIND: ${{ github.event.inputs.releaseKind }}
        run: deno run -A dprint/automation/publish-release "--${RELEASE_KIND}" Cargo.toml
